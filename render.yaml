services:
  - type: web
    name: discord-auto-server-platform
    runtime: node
    plan: free
    region: singapore
    buildCommand: node scripts/toolchain-policy-gate.mjs --enforce-runtime && npm install --no-audit --no-fund && npm run build:platform
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROCESS_ROLE
        value: all
      - key: BOT_ENABLED
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: AUTO_RUN_MIGRATIONS
        value: "true"
      - key: DISCORD_GUILD_MEMBERS_INTENT
        value: "false"
      - key: SCHEDULER_POLL_INTERVAL_MS
        value: "15000"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: INTERACTION_SIGNING_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: autoserver-assets

  - type: web
    name: discord-auto-server-dashboard
    runtime: static
    buildCommand: node scripts/toolchain-policy-gate.mjs --enforce-runtime && npm install --no-audit --no-fund && npm run build:dashboard
    staticPublishPath: apps/dashboard/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
